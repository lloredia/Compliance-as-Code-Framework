name: Policy as Code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt, validate, tflint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init and validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install "checkov>=3.2"

      - name: Checkov
        run: checkov -d . --config-file .checkov.yaml

  policy:
    name: OPA and Conftest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -fsSL -o opa "https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Install Conftest
        run: |
          curl -fsSL -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: OPA unit tests
        run: opa test policy/ -v

      - name: Conftest compliant plan
        run: conftest test --policy policy/terraform.rego policy/testdata/compliant.plan.json

      - name: Conftest rejects noncompliant plan
        run: |
          if conftest test --policy policy/terraform.rego policy/testdata/noncompliant.plan.json; then
            echo "noncompliant plan was allowed"
            exit 1
          fi

  python:
    name: Ruff and analyzer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check scripts
          ruff format --check scripts

      - name: Pytest
        run: pytest
