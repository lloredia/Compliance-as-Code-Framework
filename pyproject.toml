[project]
name = "compliance-as-code"
version = "0.1.0"
description = "Redacted Prowler summary helpers for the compliance-as-code framework."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
